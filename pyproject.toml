[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-edit-engine"
version = "0.1.0.dev0"
description = "Format-preserving PDF text editing engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aryan B V" }]
dependencies = [
    "pikepdf>=9.0.0",
    "fonttools>=4.50.0",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/AryanBV/pdf-edit-engine"
Issues = "https://github.com/AryanBV/pdf-edit-engine/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
strict = true
packages = ["pdf_edit_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
