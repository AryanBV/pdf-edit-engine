[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-edit-engine"
version = "0.1.0"
description = "Format-preserving PDF text editing — edit text in existing PDFs while preserving fonts, layout, and visual fidelity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Aryan B V", email = "aryansalian5678@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["pdf", "edit", "text", "replace", "format-preserving", "pikepdf", "font"]
dependencies = [
    "pikepdf>=9.0.0,<11",
    "fonttools>=4.50.0,<5",
    "pdfminer.six>=20231228,<20270000",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "reportlab>=4.0",
    "psutil>=5.9",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/AryanBV/pdf-edit-engine"
Repository = "https://github.com/AryanBV/pdf-edit-engine"
Issues = "https://github.com/AryanBV/pdf-edit-engine/issues"
Changelog = "https://github.com/AryanBV/pdf-edit-engine/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
strict = true
packages = ["pdf_edit_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "benchmark: performance benchmark tests",
    "slow: slow tests (clean install, etc.)",
    "stress: ultimate stress tests",
]
