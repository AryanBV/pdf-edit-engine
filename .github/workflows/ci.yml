name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest deferred to v0.1.3. The first time we ran it
        # (on commit be130d6) it surfaced 50+ real issues — most macOS
        # system fonts are .ttc TrueType Collections, not .ttf, and the
        # Tier 1.5 tests assume single-font files. The complex-corpus
        # generator also fails silently on macOS. Both are real bugs to
        # fix in v0.1.3 with proper macOS testing; including them on the
        # matrix today blocks every PR until those fixes land. Linux +
        # Windows cover the platforms most users hit.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system fonts (Linux)
        if: runner.os == 'Linux'
        # Carlito is the open-source metric equivalent of Calibri; its
        # presence lets the metric-equivalent fallback path inside
        # fonts.extend_subset / system_fonts execute on CI, which
        # accounts for ~3-4pp of line coverage on Linux. Liberation +
        # DejaVu cover the Helvetica / Times / Courier substitutes.
        run: sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-crosextra-carlito
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Typecheck
        run: python -m mypy
      - name: Docs vs code drift check
        run: python scripts/check_docs_vs_code.py
      - name: Test
        run: python -m pytest -v --cov=pdf_edit_engine
      - name: Slow tests (clean-install gate)
        # Only run on one matrix cell to avoid 4× redundant wheel-build
        # timing. The slow probes verify package installation, not
        # platform-specific behavior.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest -v -m slow tests/test_stress.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with dev extras
        run: pip install -e ".[dev]"
      - name: Run pip-audit on the resolved dependency closure
        # `--skip-editable` skips pdf-edit-engine itself (installed via
        # `pip install -e .` above). `--strict` is intentionally NOT
        # passed: it promotes the editable-skip warning into an error,
        # which contradicts `--skip-editable`'s purpose.
        #
        # `--ignore-vuln CVE-2026-3219` excludes a vulnerability in
        # `pip` itself — `pip` is bundled with the GH Actions Python
        # image, NOT a dependency we ship. CVE-2026-3219 has no fix
        # version released yet (tracked upstream); revisit this ignore
        # whenever a fixed pip release lands.
        run: python -m pip_audit --skip-editable --ignore-vuln CVE-2026-3219
