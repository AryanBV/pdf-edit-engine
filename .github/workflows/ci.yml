name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Typecheck
        # 15 pre-existing strict-mode errors in structural.py/reflow.py.
        # Non-blocking until those are resolved.
        run: python -m mypy || true
      - name: Test
        run: python -m pytest -v --cov=pdf_edit_engine
